<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lemon Going-Out Search — Laptop Demo</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f5ea;
        color: #17210d;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; }
      button, input, select { font: inherit; }
      .shell { min-height: 100vh; }
      header {
        align-items: center;
        background: #18210e;
        color: #fffef4;
        display: flex;
        justify-content: space-between;
        padding: 18px clamp(22px, 5vw, 72px);
      }
      .brand { align-items: center; display: flex; gap: 12px; font-weight: 750; letter-spacing: -0.02em; }
      .mark {
        align-items: center;
        background: #d8ff52;
        border-radius: 50%;
        color: #18210e;
        display: inline-flex;
        height: 34px;
        justify-content: center;
        width: 34px;
      }
      .live { align-items: center; color: #dce8ca; display: flex; font-size: 13px; gap: 8px; }
      .live::before { background: #99d438; border-radius: 50%; content: ""; height: 8px; width: 8px; }
      main { margin: 0 auto; max-width: 1120px; padding: clamp(36px, 6vw, 80px) 24px 72px; }
      .eyebrow { color: #5d711e; font-size: 12px; font-weight: 800; letter-spacing: .16em; margin: 0 0 12px; }
      h1 { font-size: clamp(38px, 6vw, 68px); letter-spacing: -.055em; line-height: .98; margin: 0; max-width: 780px; }
      .intro { color: #58604e; font-size: 18px; line-height: 1.55; margin: 22px 0 34px; max-width: 660px; }
      form {
        background: #fff;
        border: 1px solid #d9dccd;
        border-radius: 18px;
        box-shadow: 0 18px 50px rgba(29, 40, 17, .08);
        display: grid;
        gap: 12px;
        grid-template-columns: minmax(0, 1fr) auto auto;
        padding: 10px;
      }
      input, select {
        background: transparent;
        border: 0;
        color: #17210d;
        min-height: 50px;
        outline: none;
        padding: 0 14px;
      }
      input { font-size: 17px; min-width: 0; }
      select { border-left: 1px solid #e2e4da; color: #59614e; }
      button {
        background: #5e7200;
        border: 0;
        border-radius: 12px;
        color: #fff;
        cursor: pointer;
        font-weight: 750;
        padding: 0 24px;
      }
      button:hover { background: #4c5d00; }
      button:disabled { cursor: wait; opacity: .62; }
      .status-row { align-items: center; display: flex; justify-content: space-between; margin: 26px 2px 14px; min-height: 28px; }
      #status { color: #58604e; margin: 0; }
      #diagnostics { color: #758069; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
      #results { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .result {
        background: #fff;
        border: 1px solid #dcdfd3;
        border-radius: 16px;
        min-height: 180px;
        padding: 22px;
      }
      .result-top { align-items: start; display: flex; gap: 14px; justify-content: space-between; }
      .result h2 { font-size: 21px; letter-spacing: -.02em; margin: 0; }
      .kind { background: #eff5d8; border-radius: 999px; color: #516600; font-size: 11px; font-weight: 800; padding: 6px 9px; }
      .categories { color: #637052; font-size: 14px; margin: 13px 0 0; }
      .summary { color: #3e4735; line-height: 1.5; margin: 18px 0 0; }
      .meta { border-top: 1px solid #eceee7; color: #7a8173; font-size: 12px; margin-top: 20px; padding-top: 14px; }
      .error { background: #fff2ed; border-color: #f0b9a4; color: #8a2f16; grid-column: 1 / -1; }
      @media (max-width: 720px) {
        form { grid-template-columns: 1fr; }
        select { border-left: 0; border-top: 1px solid #e2e4da; }
        button { min-height: 50px; }
        #results { grid-template-columns: 1fr; }
        .status-row { align-items: start; flex-direction: column; gap: 6px; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <div class="brand"><span class="mark">L</span> Lemon Search</div>
        <div class="live">Local backend connected</div>
      </header>
      <main>
        <p class="eyebrow">JÖNKÖPING GOING-OUT TRIAL</p>
        <h1>Find a place worth going out for.</h1>
        <p class="intro">This laptop demo sends a real request through the Supabase Edge function and renders the public search response from PostgreSQL.</p>

        <form id="search-form">
          <input id="query" name="query" aria-label="Search places" autocomplete="off" placeholder="Try Evergreen or pizzeria" value="Evergreen Restaurang &amp; Pizzeria">
          <select id="locale" aria-label="Result language">
            <option value="en">English</option>
            <option value="sv">Svenska</option>
          </select>
          <button id="submit" type="submit">Search</button>
        </form>

        <div class="status-row">
          <p id="status">Ready to search.</p>
          <span id="diagnostics"></span>
        </div>
        <section id="results" aria-live="polite"></section>
      </main>
    </div>

    <script>
      const EDGE_URL = 'http://127.0.0.1:54321/functions/v1/search';
      const SCOPE_ID = 'a4b19b09-b272-5748-80ef-2c91d9d33ca6';
      const form = document.getElementById('search-form');
      const queryInput = document.getElementById('query');
      const localeInput = document.getElementById('locale');
      const submitButton = document.getElementById('submit');
      const status = document.getElementById('status');
      const diagnostics = document.getElementById('diagnostics');
      const results = document.getElementById('results');

      const escapeHtml = (value) => String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');

      const renderResult = (item) => {
        const title = item.type === 'EVENT' ? item.title : item.name;
        const categoryText = item.categories?.map((category) => category.label).join(' · ') || 'No categories';
        const summary = item.factualSummary ? `<p class="summary">${escapeHtml(item.factualSummary)}</p>` : '';
        const eventTime = item.type === 'EVENT' ? `<p class="summary">${escapeHtml(new Date(item.startsAt).toLocaleString())}</p>` : '';
        const coordinates = item.location
          ? `${Number(item.location.latitude).toFixed(5)}, ${Number(item.location.longitude).toFixed(5)}`
          : 'Location unavailable';
        return `<article class="result">
          <div class="result-top">
            <h2>${escapeHtml(title)}</h2>
            <span class="kind">${escapeHtml(item.type)}</span>
          </div>
          <p class="categories">${escapeHtml(categoryText)}</p>
          ${summary}${eventTime}
          <div class="meta">${escapeHtml(coordinates)} · ${escapeHtml(item.canonicalId)}</div>
        </article>`;
      };

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const query = queryInput.value.trim();
        if (!query) return;

        submitButton.disabled = true;
        status.textContent = 'Searching the live local backend…';
        diagnostics.textContent = '';
        results.replaceChildren();
        const startedAt = performance.now();

        try {
          const response = await fetch(EDGE_URL, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              query,
              uiLocale: localeInput.value,
              scopeId: SCOPE_ID,
              entityTypes: ['PLACE'],
              limit: 10,
            }),
          });
          const payload = await response.json();
          if (!response.ok) throw new Error(payload.error?.message || 'Search failed.');

          const elapsed = Math.round(performance.now() - startedAt);
          status.textContent = payload.results.length
            ? `${payload.results.length} result${payload.results.length === 1 ? '' : 's'} found.`
            : 'No places found.';
          diagnostics.textContent = `${elapsed} ms · ${payload.semanticDegraded ? 'semantic degraded' : 'deterministic available'} · ${payload.requestId}`;
          results.innerHTML = payload.results.map(renderResult).join('');
        } catch (error) {
          status.textContent = 'Search could not be completed.';
          diagnostics.textContent = `${Math.round(performance.now() - startedAt)} ms`;
          results.innerHTML = `<article class="result error">${escapeHtml(error.message)} Check that the local Supabase stack is running.</article>`;
        } finally {
          submitButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
